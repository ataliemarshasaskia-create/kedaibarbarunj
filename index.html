<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Kedai Bar-Bar - Aplikasi Pembeli & Penjual</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Poppins & Fredoka (Pop Retro Style) -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        barbarRed: '#D32F2F',
                        barbarYellow: '#FFC107',
                        barbarDarkRed: '#B71C1C',
                        barbarBg: '#FFFBE6',
                    },
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        poppins: ['Poppins', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #FFFBE6;
            background-image: radial-gradient(#F59E0B 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .font-retro {
            font-family: 'Fredoka', cursive;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #D32F2F;
            border-radius: 4px;
        }
        .pop-card {
            border: 3px solid #000;
            box-shadow: 4px 4px 0px #000;
        }
        .pop-button {
            border: 2px solid #000;
            box-shadow: 3px 3px 0px #000;
            transition: all 0.1s ease;
        }
        .pop-button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }
        .retro-title-stroke {
            text-shadow: 2px 2px 0px #B71C1C, -1px -1px 0px #B71C1C, 1px -1px 0px #B71C1C, -1px 1px 0px #B71C1C;
        }
        /* Fix product card images so they don't get cropped */
        .product-img-box {
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }
        .product-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }
    </style>
</head>
<body class="text-gray-900 pb-12 min-h-screen">

    <!-- Top Role Navigation Switcher Header -->
    <header class="sticky top-0 z-50 bg-barbarRed text-white shadow-md border-b-4 border-black">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-barbarYellow text-barbarDarkRed p-1 rounded-full border-2 border-black flex items-center justify-center">
                    <img src="logo barbar.jpg" alt="Logo Bar-Bar" class="w-10 h-10 rounded-full object-cover border border-black">
            <!-- Role View Switcher (Upgraded Pop-Retro Aesthetic) -->
            <div class="flex items-center bg-[#7F1D1D] p-1.5 rounded-2xl border-2 border-black shadow-inner gap-1.5">
                <button id="btn-customer-mode" onclick="switchView('customer')" class="px-4 py-2 rounded-xl text-sm font-retro font-bold tracking-wide transition-all flex items-center gap-2 bg-barbarYellow text-black border-2 border-black shadow-[3px_3px_0px_#000] hover:bg-yellow-300">
                    <span class="w-6 h-6 rounded-full bg-barbarRed text-white flex items-center justify-center text-xs border border-black">
                        <i class="fa-solid fa-user-graduate"></i>
                    </span>
                    <span>Mode Pembeli</span>
                </button>
                <button id="btn-seller-mode" onclick="requestSellerAccess()" class="px-4 py-2 rounded-xl text-sm font-retro font-bold tracking-wide transition-all flex items-center gap-2 bg-red-800/80 text-yellow-200 border-2 border-transparent hover:border-yellow-400/50 hover:text-white">
                    <span class="w-6 h-6 rounded-full bg-black/40 text-yellow-300 flex items-center justify-center text-xs border border-yellow-400/40">
                        <i class="fa-solid fa-lock" id="seller-lock-icon"></i>
                    </span>
                    <span>Mode Penjual (Dapur/POS)</span>
                    <span id="order-badge" class="bg-yellow-400 text-black text-xs px-2 py-0.5 rounded-full font-extrabold border border-black ml-0.5 hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- ========================================== -->
    <!--          CUSTOMER VIEW (SISI PEMBELI)      -->
    <!-- ========================================== -->
    <main id="customer-view" class="max-w-7xl mx-auto px-4 pt-6">
        
        <!-- Navigation Header (Replaced with interactive Home Page button & Your Chart) -->
        <nav class="flex flex-wrap justify-between items-center gap-3 mb-8 bg-white/80 backdrop-blur px-4 py-3 rounded-2xl border-2 border-black shadow-[4px_4px_0px_#000]">
            <div class="flex items-center gap-2">
                <button onclick="switchCustomerTab('home')" id="nav-home-btn" class="px-4 py-2 rounded-xl font-retro font-bold text-base bg-white hover:bg-yellow-100 text-barbarDarkRed border-2 border-black pop-button flex items-center gap-2">
                    <i class="fa-solid fa-house text-barbarRed"></i> Home Page
                </button>
            </div>

            <!-- Floating/Top Action Buttons for Queue Status & Your Chart -->
            <div class="flex items-center gap-2.5">
                <button onclick="openActiveQueueModal()" id="btn-my-queue" class="hidden px-4 py-2 rounded-xl font-retro font-bold text-sm bg-green-600 hover:bg-green-700 text-white border-2 border-black pop-button flex items-center gap-1.5">
                    <i class="fa-solid fa-ticket"></i> Queue <span id="nav-queue-num">#000</span>
                </button>
                <button onclick="switchCustomerTab('chart')" id="tab-chart" class="px-4 py-2 rounded-xl font-retro font-bold text-base bg-barbarYellow text-black border-2 border-black pop-button hover:bg-yellow-300 flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping"></i> Your Chart
                    <span id="nav-cart-badge" class="bg-barbarRed text-white text-xs px-2 py-0.5 rounded-full border border-black font-extrabold">0</span>
                </button>
            </div>
        </nav>

        <!-- PAGE 1: HOME PAGE (Redesigned to match the reference image) -->
        <section id="page-home" class="space-y-6">
            <div class="bg-barbarYellow rounded-3xl p-6 md:p-10 pop-card relative overflow-hidden flex flex-col items-center text-center space-y-8">
                
                <!-- Top Header banner matching reference (Updated with aesthetic Kedai Bar-bar image centered, fitted, and larger) -->
                <div class="w-full flex items-center justify-center bg-barbarRed p-4 rounded-2xl border-3 border-black shadow-md relative">
                    <div class="absolute left-4 hidden sm:flex items-center">
                        <img src="logo barbar.jpg" alt="Logo Bar-Bar" class="w-16 h-16 rounded-full object-cover border-2 border-black">
                    </div>
                    <div class="w-full max-w-md md:max-w-lg py-1 flex items-center justify-center">
                        <img src="kedai barbar.jpg" alt="Kedai Bar-Bar Aesthetic" class="w-full h-auto max-h-24 object-contain rounded-xl">
                    </div>
                    <div class="absolute right-4 hidden sm:block bg-white px-4 py-2 rounded-full border-2 border-black font-retro font-bold text-sm text-gray-900 shadow">
                        Home Page
                    </div>
                </div>

                <!-- Subtitle Pill -->
                <div class="inline-block bg-white px-8 py-2 rounded-full border-2 border-black font-retro font-bold text-lg text-gray-900 shadow">
                    WHAT DO YOU WANT TO KNOW?
                </div>

                <!-- Three Interactive Navigation Cards matching the screenshot -->
                <div class="grid md:grid-cols-3 gap-6 w-full max-w-5xl">
                    <!-- Card 1: About Us (Updated with about us 2.jpg) -->
                    <div onclick="switchCustomerTab('about')" class="bg-[#FFFDF5] rounded-3xl p-6 border-4 border-black pop-card cursor-pointer transition transform hover:-translate-y-2 flex flex-col items-center justify-center min-h-[320px] space-y-6 shadow-lg">
                        <div class="w-full max-w-[200px]">
                            <img src="about us.jpg" alt="About Us" class="w-full h-auto object-contain drop-shadow">
                        </div>
                        <div class="w-full max-w-[160px] rounded-2xl overflow-hidden border-2 border-black bg-white p-1 shadow">
                            <img src="about us 2.jpg" alt="About Us 2" class="w-full h-20 object-contain">
                        </div>
                    </div>

                    <!-- Card 2: Our Menu (Updated with our menu 2.jpg) -->
                    <div onclick="switchCustomerTab('menu')" class="bg-[#FFFDF5] rounded-3xl p-6 border-4 border-black pop-card cursor-pointer transition transform hover:-translate-y-2 flex flex-col items-center justify-center min-h-[320px] space-y-4 shadow-lg">
                        <div class="w-full max-w-[180px]">
                            <img src="our menu.jpg" alt="Our Menu" class="w-full h-auto object-contain drop-shadow">
                        </div>
                        <div class="w-full max-w-[160px] rounded-2xl overflow-hidden border-2 border-black bg-white p-1 shadow">
                            <img src="our menu 2.jpg" alt="Our Menu 2" class="w-full h-20 object-contain">
                        </div>
                    </div>

                    <!-- Card 3: Contact Person -->
                    <div onclick="switchCustomerTab('contact')" class="bg-[#FFFDF5] rounded-3xl p-6 border-4 border-black pop-card cursor-pointer transition transform hover:-translate-y-2 flex flex-col
